<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Ops — Agent Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --t-bg:#0a0a0a;
    --t-fg:#33ff99;
    --t-dim:#1a6644;
    --t-cyan:#44aaaa;
    --t-yellow:#ccaa33;
    --t-red:#cc3333;
    --t-blue:#4488cc;
    --t-white:#e8e8d8;
    --t-border:#1a3322;
    --t-highlight:#112818;
    --bar-bg:#001a0d;
  }
  html,body{height:100%;background:#000;overflow:hidden;}
  body{
    font-family:'JetBrains Mono',monospace;
    color:var(--t-fg);
    display:flex;flex-direction:column;
  }
  body::after{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
    pointer-events:none;z-index:9999;
  }
  body::before{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
    pointer-events:none;z-index:9998;
  }

  /* ── Title bar ── */
  .titlebar{
    background:#224488;
    padding:6px 16px;display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;font-size:13px;
  }
  .titlebar-left{color:#e8e8d8;font-weight:bold;letter-spacing:0.1em;}
  .titlebar-right{color:#44aaaa;font-size:11px;}

  /* ── Nav bar ── */
  .navbar{
    background:var(--bar-bg);border-bottom:1px solid var(--t-border);
    padding:0 8px;display:flex;align-items:stretch;
    flex-shrink:0;font-size:12px;
  }
  .nav-link{
    color:var(--t-cyan);text-decoration:none;
    padding:5px 14px;border-right:1px solid var(--t-border);
    display:flex;align-items:center;
  }
  .nav-link:hover{background:var(--t-highlight);color:var(--t-white);}
  .nav-link.active{background:var(--t-cyan);color:#000;font-weight:bold;}
  .nav-spacer{flex:1;}
  .nav-link.right{border-right:none;border-left:1px solid var(--t-border);color:var(--t-dim);}
  .nav-link.right:hover{color:var(--t-white);}

  /* ── Log area ── */
  .log-area{
    flex:1;overflow-y:auto;padding:0;
    scrollbar-width:thin;scrollbar-color:var(--t-dim) var(--t-bg);
    display:flex;flex-direction:column;
  }
  .log-area::-webkit-scrollbar{width:4px;}
  .log-area::-webkit-scrollbar-track{background:var(--t-bg);}
  .log-area::-webkit-scrollbar-thumb{background:var(--t-dim);}

  .log-header{
    padding:5px 12px;font-size:12px;color:var(--t-yellow);font-weight:bold;
    border-bottom:1px solid var(--t-border);background:var(--bar-bg);
    display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;
  }
  .log-header .refresh-info{font-size:10px;color:var(--t-dim);font-weight:normal;}

  .log-content{
    flex:1;overflow-y:auto;padding:8px 12px;
    scrollbar-width:thin;scrollbar-color:var(--t-dim) var(--t-bg);
  }
  .log-content::-webkit-scrollbar{width:3px;}
  .log-content::-webkit-scrollbar-track{background:var(--t-bg);}
  .log-content::-webkit-scrollbar-thumb{background:var(--t-dim);}

  .log-entry{
    margin-bottom:4px;font-size:12px;line-height:1.5;
    border-bottom:1px solid #0d1f14;padding-bottom:4px;
  }
  .log-entry:hover{background:var(--t-highlight);}
  .log-line{display:flex;gap:8px;flex-wrap:wrap;}
  .log-ts{color:var(--t-dim);font-size:10px;flex-shrink:0;min-width:70px;}
  .log-from{color:var(--t-yellow);font-weight:bold;flex-shrink:0;}
  .log-arrow{color:var(--t-dim);flex-shrink:0;}
  .log-to{color:var(--t-yellow);font-weight:bold;flex-shrink:0;}
  .log-type{color:var(--t-cyan);font-size:11px;flex-shrink:0;}
  .log-body{color:var(--t-white);white-space:pre-wrap;word-break:break-word;}

  .empty-log{color:var(--t-dim);font-size:12px;padding:20px;text-align:center;}

  /* ── Stats bar ── */
  .stats-bar{
    background:var(--bar-bg);border-top:1px solid var(--t-border);
    border-bottom:1px solid var(--t-border);
    padding:4px 12px;font-size:11px;color:var(--t-dim);
    display:flex;gap:16px;flex-shrink:0;
  }
  .stat-item span{color:var(--t-cyan);}

  .statusbar{
    background:var(--bar-bg);border-top:1px solid var(--t-border);
    padding:3px 16px;font-size:11px;color:var(--t-dim);
    display:flex;justify-content:space-between;flex-shrink:0;
  }

  @media(max-width:600px){
    .nav-link{padding:5px 8px;font-size:11px;}
    .log-entry{font-size:11px;}
  }
</style>
<script src="/auth-guard.js"></script>
</head>
<body>
<div class="titlebar">
  <span class="titlebar-left">[=] IT OPS</span>
  <span class="titlebar-right" id="clock">--:--:--</span>
</div>
<div class="navbar">
  <a href="/tui" class="nav-link">TERMINAL</a>
  <a href="/tui-incidents" class="nav-link">INCIDENTS</a>
  <a href="/tui-servers" class="nav-link">SERVERS</a>
  <a href="/tui-chat" class="nav-link">CHAT</a>
  <a href="/tui-bridge" class="nav-link active">BRIDGE</a>
  <a href="/tui-workflows" class="nav-link">WORKFLOWS</a>
  <a href="/tui-monitoring" class="nav-link">MONITORING</a>
  <a href="/tui-audit" class="nav-link">AUDIT</a>
  <a href="/tui-agents" class="nav-link">AGENTS</a>
  <a href="/tui-irc" class="nav-link">IRC</a>
  <span class="nav-spacer"></span>
  <a href="/dashboard" class="nav-link right">GUI</a>
  <a href="/login.html" class="nav-link right">LOGIN</a>
</div>
<div class="stats-bar" id="stats-bar">
  <span class="stat-item">Messages: <span id="stat-msgs">-</span></span>
  <span class="stat-item">Agents: <span id="stat-agents">-</span></span>
  <span class="stat-item">Tasks: <span id="stat-tasks">-</span></span>
  <span class="stat-item">Bridge: <span id="stat-status">checking...</span></span>
</div>
<div class="log-area">
  <div class="log-header">
    <span>AGENT MESSAGE BUS</span>
    <span class="refresh-info" id="refresh-info">auto-refresh 5s</span>
  </div>
  <div class="log-content" id="log-content">
    <div class="empty-log" id="empty">Loading bridge messages...</div>
  </div>
</div>
<div class="statusbar">
  <span id="sb">READY</span>
  <span>AUTO-REFRESH=5s</span>
</div>

<script>
var token = sessionStorage.getItem('itops_token') || localStorage.getItem('itops_token') || '';

var poll = null;
var lastCount = 0;
const hdr = () => ({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' });

setInterval(() => { document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8); }, 1000);

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function fmtTime(ts) {
  if (!ts) return '--:--:--';
  try { return new Date(ts).toLocaleTimeString(); } catch(e) { return ts; }
}

function fmtDate(ts) {
  if (!ts) return '-';
  try { return new Date(ts).toLocaleString(); } catch(e) { return ts; }
}

async function loadMessages() {
  document.getElementById('sb').textContent = 'Fetching...';
  try {
    const r = await fetch('/api/agent-bridge/messages?limit=200', { headers: hdr() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const msgs = await r.json();
    document.getElementById('stat-msgs').textContent = msgs.length;
    renderLog(msgs);
  } catch(e) {
    document.getElementById('log-content').innerHTML =
      '<div class="empty-log">Error loading messages: ' + esc(e.message) + '</div>';
  }
  document.getElementById('sb').textContent = 'READY';
  document.getElementById('refresh-info').textContent = 'updated ' + new Date().toLocaleTimeString();
}

async function loadStatus() {
  try {
    const r = await fetch('/api/agent-bridge/status', { headers: hdr() });
    if (!r.ok) return;
    const s = await r.json();
    document.getElementById('stat-status').textContent = s.initialized ? 'ONLINE' : 'OFFLINE';
    document.getElementById('stat-status').style.color = s.initialized ? '#33aa55' : 'var(--t-red)';
  } catch(e) {
    document.getElementById('stat-status').textContent = 'ERROR';
    document.getElementById('stat-status').style.color = 'var(--t-red)';
  }
}

async function loadAgents() {
  try {
    const r = await fetch('/api/agent-bridge/agents', { headers: hdr() });
    if (!r.ok) return;
    const agents = await r.json();
    document.getElementById('stat-agents').textContent = agents.length;
  } catch(e) {}
}

async function loadTasks() {
  try {
    const r = await fetch('/api/agent-bridge/tasks', { headers: hdr() });
    if (!r.ok) return;
    const tasks = await r.json();
    document.getElementById('stat-tasks').textContent = tasks.length;
  } catch(e) {}
}

function renderLog(msgs) {
  const el = document.getElementById('log-content');
  if (!msgs.length) {
    el.innerHTML = '<div class="empty-log">No bridge messages yet. Agent-to-agent communication will appear here.</div>';
    return;
  }
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
  // Show newest first
  const sorted = [...msgs].reverse();
  el.innerHTML = sorted.map(m => {
    const from = m.from || m.sender || '-';
    const to = m.to || m.recipient || '*';
    const type = m.type || 'msg';
    const content = m.content || m.message || m.text || '';
    const ts = m.timestamp || m.ts || m.createdAt;
    return `<div class="log-entry">
      <div class="log-line">
        <span class="log-ts">${esc(fmtTime(ts))}</span>
        <span class="log-from">${esc(from)}</span>
        <span class="log-arrow">-></span>
        <span class="log-to">${esc(to)}</span>
        <span class="log-type">[${esc(type)}]</span>
      </div>
      <div class="log-body">${esc(String(content).slice(0, 500))}</div>
    </div>`;
  }).join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

async function loadAll() {
  await Promise.allSettled([loadMessages(), loadStatus(), loadAgents(), loadTasks()]);
}

loadAll();
poll = setInterval(loadAll, 5000);
</script>
</body>
</html>
