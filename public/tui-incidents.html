<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Ops — Incidents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --t-bg:#0a0a0a;
    --t-fg:#33ff99;
    --t-dim:#1a6644;
    --t-cyan:#44aaaa;
    --t-yellow:#ccaa33;
    --t-red:#cc3333;
    --t-blue:#4488cc;
    --t-white:#e8e8d8;
    --t-border:#1a3322;
    --t-highlight:#112818;
    --bar-bg:#001a0d;
  }
  html,body{height:100%;background:#000;overflow:hidden;}
  body{
    font-family:'JetBrains Mono',monospace;
    color:var(--t-fg);
    display:flex;flex-direction:column;
  }
  body::after{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
    pointer-events:none;z-index:9999;
  }
  body::before{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
    pointer-events:none;z-index:9998;
  }

  /* ── Title bar ── */
  .titlebar{
    background:#224488;
    padding:6px 16px;display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;font-size:13px;
  }
  .titlebar-left{color:#e8e8d8;font-weight:bold;letter-spacing:0.1em;}
  .titlebar-right{color:#44aaaa;font-size:11px;}

  /* ── Nav bar ── */
  .navbar{
    background:var(--bar-bg);border-bottom:1px solid var(--t-border);
    padding:0 8px;display:flex;align-items:stretch;
    flex-shrink:0;font-size:12px;gap:0;
  }
  .nav-link{
    color:var(--t-cyan);text-decoration:none;
    padding:5px 14px;border-right:1px solid var(--t-border);
    display:flex;align-items:center;
  }
  .nav-link:hover{background:var(--t-highlight);color:var(--t-white);}
  .nav-link.active{background:var(--t-cyan);color:#000;font-weight:bold;}
  .nav-spacer{flex:1;}
  .nav-link.right{border-right:none;border-left:1px solid var(--t-border);color:var(--t-dim);}
  .nav-link.right:hover{color:var(--t-white);}

  /* ── Main content area ── */
  .content{
    flex:1;overflow-y:auto;padding:12px 16px;
    scrollbar-width:thin;scrollbar-color:var(--t-dim) var(--t-bg);
  }
  .content::-webkit-scrollbar{width:4px;}
  .content::-webkit-scrollbar-track{background:var(--t-bg);}
  .content::-webkit-scrollbar-thumb{background:var(--t-dim);}

  /* ── Stats bar ── */
  .stats-bar{
    font-size:13px;padding:8px 0;margin-bottom:8px;
    border-bottom:1px solid var(--t-border);
    color:var(--t-white);letter-spacing:0.03em;
  }
  .stats-bar .stat-label{color:var(--t-dim);margin-right:4px;}
  .stats-bar .stat-val{font-weight:bold;margin-right:16px;}
  .stats-bar .stat-val.critical{color:var(--t-red);}
  .stats-bar .stat-val.open{color:var(--t-yellow);}
  .stats-bar .stat-val.resolved{color:#33aa55;}
  .stats-bar .sep{color:var(--t-dim);margin:0 8px;}

  /* ── TUI table ── */
  .tui-table{font-size:12px;margin:4px 0 8px;}
  .tui-table .tui-row{display:flex;border-bottom:1px solid #0d1f14;}
  .tui-table .tui-row:hover{background:var(--t-highlight);}
  .tui-table .tui-row.tui-header{color:var(--t-yellow);font-weight:bold;border-bottom:1px solid var(--t-border);}
  .tui-table .tui-cell{padding:2px 8px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .s-ok{color:#33aa55;}
  .s-warn{color:var(--t-yellow);}
  .s-err{color:var(--t-red);}
  .s-info{color:var(--t-cyan);}
  .s-run{color:var(--t-blue);}

  /* ── Section header ── */
  .section-header{
    color:var(--t-cyan);font-weight:bold;font-size:13px;
    border-bottom:1px solid var(--t-border);padding-bottom:2px;margin:8px 0 4px;
  }

  .dim{color:var(--t-dim);}

  /* ── Status bar ── */
  .statusbar{
    background:var(--bar-bg);border-top:1px solid var(--t-border);
    padding:3px 16px;font-size:11px;color:var(--t-dim);
    display:flex;justify-content:space-between;flex-shrink:0;
  }

  @media(max-width:600px){
    .titlebar,.navbar,.statusbar{padding-left:8px;padding-right:8px;}
    .content{padding:8px;}
    .tui-table{font-size:11px;}
    .nav-link{padding:5px 8px;font-size:11px;}
  }
</style>
<script src="/auth-guard.js"></script>
</head>
<body>
<div class="titlebar">
  <span class="titlebar-left">[=] IT OPS</span>
  <span class="titlebar-right" id="clock">--:--:--</span>
</div>
<div class="navbar">
  <a href="/tui" class="nav-link">TERMINAL</a>
  <a href="/tui-incidents" class="nav-link active">INCIDENTS</a>
  <a href="/tui-servers" class="nav-link">SERVERS</a>
  <a href="/tui-chat" class="nav-link">CHAT</a>
  <a href="/tui-bridge" class="nav-link">BRIDGE</a>
  <a href="/tui-workflows" class="nav-link">WORKFLOWS</a>
  <a href="/tui-monitoring" class="nav-link">MONITORING</a>
  <a href="/tui-audit" class="nav-link">AUDIT</a>
  <a href="/tui-agents" class="nav-link">AGENTS</a>
  <a href="/tui-irc" class="nav-link">IRC</a>
  <span class="nav-spacer"></span>
  <a href="/dashboard" class="nav-link right">GUI</a>
  <a href="/login.html" class="nav-link right">LOGIN</a>
</div>

<div class="content" id="content">
  <div class="stats-bar" id="stats-bar">
    <span class="stat-label">TOTAL:</span><span class="stat-val" id="stat-total">--</span>
    <span class="sep">|</span>
    <span class="stat-label">OPEN:</span><span class="stat-val open" id="stat-open">--</span>
    <span class="sep">|</span>
    <span class="stat-label">CRITICAL:</span><span class="stat-val critical" id="stat-critical">--</span>
    <span class="sep">|</span>
    <span class="stat-label">RESOLVED:</span><span class="stat-val resolved" id="stat-resolved">--</span>
  </div>

  <div class="section-header" id="table-header">INCIDENTS</div>
  <div id="table-container"></div>
</div>

<div class="statusbar">
  <span id="sb-left">LOADING...</span>
  <span id="sb-right">Auto-refresh: 10s</span>
</div>

<script>
'use strict';

// ── Auth check ──
var token = sessionStorage.getItem('itops_token') || localStorage.getItem('itops_token') || '';
var hdrs = function() { return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }; };

// ── Clock ──
setInterval(function() { document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8); }, 1000);
document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8);

// ── Helpers ──
function timeAgo(ts) {
  if (!ts) return '-';
  var m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

function formatDate(ts) {
  if (!ts) return '-';
  var d = new Date(ts);
  if (isNaN(d)) return '-';
  var mo = String(d.getMonth() + 1).padStart(2, '0');
  var da = String(d.getDate()).padStart(2, '0');
  var hh = String(d.getHours()).padStart(2, '0');
  var mm = String(d.getMinutes()).padStart(2, '0');
  return d.getFullYear() + '-' + mo + '-' + da + ' ' + hh + ':' + mm;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sevClass(sev) {
  var s = (sev || '').toLowerCase();
  if (s === 'critical') return 's-err';
  if (s === 'high' || s === 'warning') return 's-warn';
  if (s === 'low' || s === 'ok' || s === 'info') return 's-ok';
  return 's-warn';
}

function statusClass(status) {
  var s = (status || '').toLowerCase();
  if (s === 'open') return 's-err';
  if (s === 'investigating' || s === 'mitigating') return 's-warn';
  if (s === 'resolved' || s === 'closed') return 's-ok';
  return 's-info';
}

function statusBadge(status) {
  return '<span class="' + statusClass(status) + '">[' + escHtml(status || 'unknown') + ']</span>';
}

function sevBadge(sev) {
  return '<span class="' + sevClass(sev) + '">' + escHtml(sev || '-') + '</span>';
}

// ── Table rendering ──
function buildTable(cols, rows, widths) {
  var container = document.getElementById('table-container');
  container.innerHTML = '';

  var table = document.createElement('div');
  table.className = 'tui-table';

  // Header row
  var hr = document.createElement('div');
  hr.className = 'tui-row tui-header';
  cols.forEach(function(h, i) {
    var cell = document.createElement('span');
    cell.className = 'tui-cell';
    cell.style.width = widths[i] + 'px';
    cell.style.minWidth = widths[i] + 'px';
    cell.textContent = h;
    hr.appendChild(cell);
  });
  table.appendChild(hr);

  // Data rows
  rows.forEach(function(row) {
    var tr = document.createElement('div');
    tr.className = 'tui-row';
    row.forEach(function(val, i) {
      var cell = document.createElement('span');
      cell.className = 'tui-cell';
      cell.style.width = widths[i] + 'px';
      cell.style.minWidth = widths[i] + 'px';
      cell.innerHTML = val;
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });

  container.appendChild(table);
}

// ── Data fetching ──
var allIncidents = [];

async function loadIncidents() {
  var sbLeft = document.getElementById('sb-left');
  sbLeft.textContent = 'FETCHING...';

  try {
    var res = await fetch('/api/incidents', { headers: hdrs() });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    allIncidents = Array.isArray(data) ? data : (data.incidents || data.data || []);
  } catch (e) {
    sbLeft.textContent = 'ERROR: ' + e.message;
    return;
  }

  // Update stats
  var total = allIncidents.length;
  var open = allIncidents.filter(function(i) {
    var s = (i.status || '').toLowerCase();
    return s !== 'resolved' && s !== 'closed';
  }).length;
  var critical = allIncidents.filter(function(i) {
    return (i.severity || '').toLowerCase() === 'critical';
  }).length;
  var resolved = allIncidents.filter(function(i) {
    return (i.status || '').toLowerCase() === 'resolved' || (i.status || '').toLowerCase() === 'closed';
  }).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-open').textContent = open;
  document.getElementById('stat-critical').textContent = critical;
  document.getElementById('stat-resolved').textContent = resolved;

  // Update header
  document.getElementById('table-header').textContent = 'INCIDENTS (' + total + ')';

  // Build table
  if (total === 0) {
    document.getElementById('table-container').innerHTML =
      '<div class="dim" style="padding:8px 0;">  No incidents found. System is running normally.</div>';
    sbLeft.textContent = 'READY';
    return;
  }

  var rows = allIncidents.map(function(inc) {
    var id = (inc.id || inc._id || '').slice(0, 8);
    var title = escHtml((inc.title || '-').slice(0, 50));
    var sev = sevBadge(inc.severity);
    var status = statusBadge(inc.status);
    var created = formatDate(inc.createdAt || inc.created_at || inc.openedAt);
    return [id, title, sev, status, created];
  });

  buildTable(
    ['ID', 'TITLE', 'SEVERITY', 'STATUS', 'CREATED'],
    rows,
    [80, 320, 100, 130, 160]
  );

  sbLeft.textContent = 'READY  |  ' + total + ' incident' + (total !== 1 ? 's' : '') + '  |  Updated ' + new Date().toTimeString().slice(0, 8);
}

// ── Initial load + auto-refresh ──
loadIncidents();
setInterval(loadIncidents, 10000);
</script>
</body>
</html>
