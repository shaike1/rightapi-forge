<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — RightAPI Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #FFFFFF;
    --bg-soft:   #F7F7F7;
    --border:    #E5E7EB;
    --border2:   #D1D5DB;
    --text:      #363737;
    --text2:     #6B7280;
    --text3:     #9CA3AF;
    --accent:    #306EF0;
    --accent-d:  #1E55D0;
    --warm:      #E8734A;
    --danger:    #EF4444;
    --danger-bg: #FEF2F2;
    --shadow:    0 12px 32px rgba(15, 23, 42, .10), 0 4px 8px rgba(15, 23, 42, .05);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--text);
  }

  body {
    background: var(--bg-soft);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(48, 110, 240, .08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(232, 115, 74, .06), transparent 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .shell {
    width: 100%;
    max-width: 460px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1rem;
    box-shadow: 0 6px 16px rgba(48, 110, 240, .30);
  }
  .brand-text { text-align: left; }
  .brand-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: -.01em;
    line-height: 1.1;
  }
  .brand-sub {
    font-size: .8rem;
    color: var(--text2);
    margin-top: 2px;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 32px;
    box-shadow: var(--shadow);
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.02em;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--text2);
    font-size: .9rem;
    margin-bottom: 22px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: .82rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 10px 14px;
    font-family: inherit;
    font-size: .92rem;
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  .field input::placeholder { color: var(--text3); }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(48, 110, 240, .18);
  }
  .field input:read-only {
    background: var(--bg-soft);
    color: var(--text2);
    cursor: default;
  }

  .slug-preview {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-soft);
  }
  .slug-preview .slug-value {
    flex: 1;
    padding: 10px 14px;
    font-size: .92rem;
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    background: transparent;
    border: none;
    outline: none;
  }
  .slug-preview .slug-suffix {
    padding: 10px 14px;
    font-size: .82rem;
    color: var(--text2);
    background: var(--bg);
    border-left: 1px solid var(--border);
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  .hint {
    font-size: .75rem;
    color: var(--text2);
    margin-top: 6px;
  }

  .register-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 20px;
    font-family: inherit;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    margin-top: 10px;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
  }
  .register-btn:hover { background: var(--accent-d); }
  .register-btn:active { transform: translateY(1px); }
  .register-btn:disabled {
    background: var(--text3);
    cursor: not-allowed;
    transform: none;
  }

  .error-msg {
    background: var(--danger-bg);
    border: 1px solid rgba(239, 68, 68, .25);
    color: var(--danger);
    padding: 10px 14px;
    font-size: .82rem;
    margin-bottom: 16px;
    border-radius: 8px;
    display: none;
  }

  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: .85rem;
    color: var(--text2);
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .footer a:hover { color: var(--accent-d); text-decoration: underline; }

  .version {
    text-align: center;
    color: var(--text3);
    font-size: .72rem;
    margin-top: 18px;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="brand-mark">RF</div>
    <div class="brand-text">
      <div class="brand-title">RightAPI Forge</div>
      <div class="brand-sub">Operations Intelligence Platform</div>
    </div>
  </div>

  <div class="card">
    <h1>Create your workspace</h1>
    <p class="subtitle">Stand up a new tenant in under a minute. You become its admin.</p>

    <div class="error-msg" id="error"></div>

    <div class="field">
      <label for="orgName">Organization name</label>
      <input type="text" id="orgName" placeholder="Acme Corp" autocomplete="organization" autofocus>
    </div>

    <div class="field">
      <label for="slug">Workspace URL</label>
      <div class="slug-preview">
        <input type="text" id="slug" class="slug-value" value="your-org" readonly aria-readonly="true">
        <div class="slug-suffix" id="slugSuffix">-itops.example.com</div>
      </div>
      <div class="hint">Auto-generated from your organization name.</div>
    </div>

    <div class="field">
      <label for="username">Email (username)</label>
      <input type="email" id="username" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
    </div>

    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Re-enter password" autocomplete="new-password">
    </div>

    <button class="register-btn" id="registerBtn" onclick="doRegister()">Create account</button>

    <div class="footer">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </div>

  <div class="version">RightAPI Forge · v1.0</div>
</div>

<script>
const orgNameInput = document.getElementById('orgName');
const slugInput = document.getElementById('slug');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirm');
const registerBtn = document.getElementById('registerBtn');
const errorEl = document.getElementById('error');
const slugSuffixEl = document.getElementById('slugSuffix');

// The checked-in value is a reserved example domain. Deployments expose their
// configured public tenant base domain so this preview stays accurate without
// embedding an operator's domain in distributable source.
fetch('/api/tenant/public')
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (data && data.workspaceBaseDomain) slugSuffixEl.textContent = '-' + data.workspaceBaseDomain;
  })
  .catch(() => { /* keep the reserved example fallback */ });

// Mirrors server-side slugify() in src/tenancy/RegistrationService.ts —
// lowercase ASCII alnum + hyphen, max 32, no leading/trailing dash.
function slugify(input) {
  if (!input) return 'your-org';
  const s = input.toLowerCase()
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 32)
    .replace(/^-+|-+$/g, '');
  return s || 'your-org';
}

orgNameInput.addEventListener('input', () => {
  slugInput.value = slugify(orgNameInput.value.trim());
});

[orgNameInput, usernameInput, passwordInput, confirmInput].forEach((el, idx, arr) => {
  el.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (idx === arr.length - 1) { doRegister(); return; }
    arr[idx + 1].focus();
  });
});

async function doRegister() {
  const orgName = orgNameInput.value.trim();
  const email = usernameInput.value.trim();
  const password = passwordInput.value;
  const confirm = confirmInput.value;

  errorEl.style.display = 'none';

  if (!orgName) { showError('Organization name is required'); return; }
  if (orgName.length < 2) { showError('Organization name must be at least 2 characters'); return; }
  if (!email) { showError('Email is required'); return; }
  if (!password) { showError('Password is required'); return; }
  if (password.length < 8) { showError('Password must be at least 8 characters'); return; }
  if (password !== confirm) { showError('Passwords do not match'); return; }

  registerBtn.disabled = true;
  registerBtn.textContent = 'Creating workspace…';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, orgName }),
    });
    const data = await res.json();
    const token = data && data.session && data.session.token;
    if (res.ok && token) {
      sessionStorage.setItem('itops_token', token);
      localStorage.setItem('itops_token', token);
      window.location.href = '/app/onboarding';
    } else {
      showError((data && (data.error || data.message)) || 'Registration failed');
    }
  } catch (e) {
    showError('Connection error: ' + e.message);
  }

  registerBtn.disabled = false;
  registerBtn.textContent = 'Create account';
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}

// If already signed in, go straight to the app.
const existingToken = sessionStorage.getItem('itops_token') || localStorage.getItem('itops_token');
if (existingToken) {
  fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + existingToken } })
    .then(r => { if (r.ok) window.location.href = '/app/'; })
    .catch(() => {});
}
</script>
</body>
</html>
