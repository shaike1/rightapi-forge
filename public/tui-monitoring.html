<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Ops — Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --t-bg:#0a0a0a;
    --t-fg:#33ff99;
    --t-dim:#1a6644;
    --t-cyan:#44aaaa;
    --t-yellow:#ccaa33;
    --t-red:#cc3333;
    --t-blue:#4488cc;
    --t-white:#e8e8d8;
    --t-border:#1a3322;
    --t-highlight:#112818;
    --bar-bg:#001a0d;
  }
  html,body{height:100%;background:#000;overflow:hidden;}
  body{
    font-family:'JetBrains Mono',monospace;
    color:var(--t-fg);
    display:flex;flex-direction:column;
  }
  body::after{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
    pointer-events:none;z-index:9999;
  }
  body::before{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
    pointer-events:none;z-index:9998;
  }
  .titlebar{
    background:#224488;
    padding:6px 16px;display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;font-size:13px;
  }
  .titlebar-left{color:#e8e8d8;font-weight:bold;letter-spacing:0.1em;}
  .titlebar-right{color:#44aaaa;font-size:11px;}
  .navbar{
    background:var(--bar-bg);border-bottom:1px solid var(--t-border);
    padding:0 8px;display:flex;align-items:stretch;
    flex-shrink:0;font-size:12px;gap:0;
  }
  .nav-link{
    color:var(--t-cyan);text-decoration:none;
    padding:5px 14px;border-right:1px solid var(--t-border);
    display:flex;align-items:center;
  }
  .nav-link:hover{background:var(--t-highlight);color:var(--t-white);}
  .nav-link.active{background:var(--t-cyan);color:#000;font-weight:bold;}
  .nav-spacer{flex:1;}
  .nav-link.right{border-right:none;border-left:1px solid var(--t-border);color:var(--t-dim);}
  .nav-link.right:hover{color:var(--t-white);}
  .content{
    flex:1;overflow-y:auto;padding:12px 16px;
    scrollbar-width:thin;scrollbar-color:var(--t-dim) var(--t-bg);
  }
  .content::-webkit-scrollbar{width:4px;}
  .content::-webkit-scrollbar-track{background:var(--t-bg);}
  .content::-webkit-scrollbar-thumb{background:var(--t-dim);}
  .tui-table{font-size:12px;margin:4px 0 8px;}
  .tui-table .tui-row{display:flex;border-bottom:1px solid #0d1f14;}
  .tui-table .tui-row:hover{background:var(--t-highlight);}
  .tui-table .tui-row.tui-header{color:var(--t-yellow);font-weight:bold;border-bottom:1px solid var(--t-border);}
  .tui-table .tui-cell{padding:2px 8px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .s-ok{color:#33aa55;}
  .s-warn{color:var(--t-yellow);}
  .s-err{color:var(--t-red);}
  .s-info{color:var(--t-cyan);}
  .section-header{
    color:var(--t-cyan);font-weight:bold;font-size:13px;
    border-bottom:1px solid var(--t-border);padding-bottom:2px;margin:12px 0 4px;
  }
  .section-header:first-child{margin-top:0;}
  .mono-line{font-size:12px;padding:4px 0;color:var(--t-white);}
  .dim{color:var(--t-dim);}
  .statusbar{
    background:var(--bar-bg);border-top:1px solid var(--t-border);
    padding:3px 16px;font-size:11px;color:var(--t-dim);
    display:flex;justify-content:space-between;flex-shrink:0;
  }
  @media(max-width:600px){
    .titlebar,.navbar,.statusbar{padding-left:8px;padding-right:8px;}
    .content{padding:8px;}
    .tui-table{font-size:11px;}
    .nav-link{padding:5px 8px;font-size:11px;}
  }
</style>
<script src="/auth-guard.js"></script>
</head>
<body>
<div class="titlebar">
  <span class="titlebar-left">[=] IT OPS</span>
  <span class="titlebar-right" id="clock">--:--:--</span>
</div>
<div class="navbar">
  <a href="/tui" class="nav-link">TERMINAL</a>
  <a href="/tui-incidents" class="nav-link">INCIDENTS</a>
  <a href="/tui-servers" class="nav-link">SERVERS</a>
  <a href="/tui-chat" class="nav-link">CHAT</a>
  <a href="/tui-bridge" class="nav-link">BRIDGE</a>
  <a href="/tui-workflows" class="nav-link">WORKFLOWS</a>
  <a href="/tui-monitoring" class="nav-link active">MONITORING</a>
  <a href="/tui-audit" class="nav-link">AUDIT</a>
  <a href="/tui-agents" class="nav-link">AGENTS</a>
  <a href="/tui-irc" class="nav-link">IRC</a>
  <span class="nav-spacer"></span>
  <a href="/dashboard" class="nav-link right">GUI</a>
  <a href="/login.html" class="nav-link right">LOGIN</a>
</div>

<div class="content" id="content">
  <div class="section-header">BACKUP HEALTH</div>
  <div id="backup-section"><span class="dim">Loading...</span></div>

  <div class="section-header">ORCHESTRATOR QUEUE</div>
  <div id="queue-section"><span class="dim">Loading...</span></div>

  <div class="section-header">WORKFLOW DRIFT</div>
  <div id="drift-section"><span class="dim">Loading...</span></div>

  <div class="section-header">ACTIVE ALERTS</div>
  <div id="alerts-section"><span class="dim">Loading...</span></div>
</div>

<div class="statusbar">
  <span id="sb-left">LOADING...</span>
  <span id="sb-right">Auto-refresh: 20s</span>
</div>

<script>
'use strict';

var token = sessionStorage.getItem('itops_token') || localStorage.getItem('itops_token') || '';
var hdrs = function() { return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }; };

setInterval(function() { document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8); }, 1000);
document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8);

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(ts) {
  if (!ts) return '-';
  var m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

function buildTable(cols, rows, widths, container) {
  container.innerHTML = '';
  if (rows.length === 0) {
    container.innerHTML = '<div class="dim" style="padding:4px 0;">  No data.</div>';
    return;
  }
  var table = document.createElement('div');
  table.className = 'tui-table';
  var hr = document.createElement('div');
  hr.className = 'tui-row tui-header';
  cols.forEach(function(h, i) {
    var cell = document.createElement('span');
    cell.className = 'tui-cell';
    cell.style.width = widths[i] + 'px';
    cell.style.minWidth = widths[i] + 'px';
    cell.textContent = h;
    hr.appendChild(cell);
  });
  table.appendChild(hr);
  rows.forEach(function(row) {
    var tr = document.createElement('div');
    tr.className = 'tui-row';
    row.forEach(function(val, i) {
      var cell = document.createElement('span');
      cell.className = 'tui-cell';
      cell.style.width = widths[i] + 'px';
      cell.style.minWidth = widths[i] + 'px';
      cell.innerHTML = val;
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  container.appendChild(table);
}

async function loadAll() {
  var sbLeft = document.getElementById('sb-left');
  sbLeft.textContent = 'FETCHING...';

  // Backup health
  try {
    var r1 = await fetch('/api/system/backups/health', { headers: hdrs() });
    if (r1.status === 401) { window.location.href = '/login.html'; return; }
    var h = await r1.json();
    var staleClass = h.stale ? 's-warn' : 's-ok';
    var vOk = h.verification && h.verification.ok;
    var vClass = vOk ? 's-ok' : 's-err';
    document.getElementById('backup-section').innerHTML =
      '<div class="mono-line">' +
      'Last success: <span class="' + staleClass + '">' + escHtml(h.lastSuccessAt ? new Date(h.lastSuccessAt).toLocaleString() : '-') + '</span>  ' +
      'Stale: <span class="' + staleClass + '">' + (h.stale ? 'YES' : 'NO') + '</span>  ' +
      'Verify: <span class="' + vClass + '">' + (vOk ? 'OK' : 'FAIL') + '</span>' +
      '</div>';
  } catch(e) {
    document.getElementById('backup-section').innerHTML = '<div class="s-err">Error: ' + escHtml(e.message) + '</div>';
  }

  // Orchestrator queue
  try {
    var r2 = await fetch('/api/orchestrator/status', { headers: hdrs() });
    var orch = await r2.json();
    var qc = orch.queueCounts || {};
    var rows2 = Object.keys(qc).map(function(phase) {
      return [escHtml(phase), String(qc[phase])];
    });
    buildTable(['PHASE','COUNT'], rows2, [200,80], document.getElementById('queue-section'));
  } catch(e) {
    document.getElementById('queue-section').innerHTML = '<div class="s-err">Error: ' + escHtml(e.message) + '</div>';
  }

  // Workflow drift
  try {
    var r3 = await fetch('/api/workflows/health', { headers: hdrs() });
    var wh = await r3.json();
    document.getElementById('drift-section').innerHTML =
      '<div class="mono-line">' +
      'Active: <span class="s-info">' + (wh.totalActive || 0) + '</span>  ' +
      'Drifted: <span class="' + (wh.driftedCount > 0 ? 's-warn' : 's-ok') + '">' + (wh.driftedCount || 0) + '</span>  ' +
      'Stuck: <span class="' + (wh.stuckCount > 0 ? 's-err' : 's-ok') + '">' + (wh.stuckCount || 0) + '</span>' +
      '</div>';
  } catch(e) {
    document.getElementById('drift-section').innerHTML = '<div class="s-err">Error: ' + escHtml(e.message) + '</div>';
  }

  // Active alerts
  try {
    var r4 = await fetch('/api/alerts', { headers: hdrs() });
    var alerts = await r4.json();
    var alertList = Array.isArray(alerts) ? alerts : (alerts.alerts || alerts.data || []);
    var rows4 = alertList.map(function(a) {
      var sev = (a.severity || a.level || '-').toUpperCase();
      var sevClass = sev === 'CRITICAL' ? 's-err' : sev === 'HIGH' || sev === 'WARNING' ? 's-warn' : 's-info';
      return [
        escHtml(a.kind || a.type || '-'),
        '<span class="' + sevClass + '">' + escHtml(sev) + '</span>',
        escHtml((a.message || a.summary || '-').slice(0,80)),
        timeAgo(a.createdAt || a.timestamp)
      ];
    });
    if (rows4.length === 0) {
      document.getElementById('alerts-section').innerHTML = '<div class="dim" style="padding:4px 0;">  No active alerts.</div>';
    } else {
      buildTable(['KIND','SEV','MESSAGE','AGE'], rows4, [100,80,280,80], document.getElementById('alerts-section'));
    }
  } catch(e) {
    document.getElementById('alerts-section').innerHTML = '<div class="s-err">Error: ' + escHtml(e.message) + '</div>';
  }

  sbLeft.textContent = 'READY  |  Updated ' + new Date().toTimeString().slice(0,8);
}

loadAll();
setInterval(loadAll, 20000);
</script>
</body>
</html>
