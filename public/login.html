<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — RightAPI Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #FFFFFF;
    --bg-soft:   #F7F7F7;
    --border:    #E5E7EB;
    --border2:   #D1D5DB;
    --text:      #363737;
    --text2:     #6B7280;
    --text3:     #9CA3AF;
    --accent:    #306EF0;
    --accent-d:  #1E55D0;
    --warm:      #E8734A;
    --danger:    #EF4444;
    --danger-bg: #FEF2F2;
    --shadow:    0 12px 32px rgba(15, 23, 42, .10), 0 4px 8px rgba(15, 23, 42, .05);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--text);
  }

  body {
    background: var(--bg-soft);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(48, 110, 240, .08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(232, 115, 74, .06), transparent 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .shell {
    width: 100%;
    max-width: 420px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1rem;
    box-shadow: 0 6px 16px rgba(48, 110, 240, .30);
  }
  .brand-text {
    text-align: left;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: -.01em;
    line-height: 1.1;
  }
  .brand-sub {
    font-size: .8rem;
    color: var(--text2);
    margin-top: 2px;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.02em;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--text2);
    font-size: .9rem;
    margin-bottom: 24px;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: .82rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 10px 14px;
    font-family: inherit;
    font-size: .92rem;
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  .field input::placeholder { color: var(--text3); }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(48, 110, 240, .18);
  }

  .login-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 20px;
    font-family: inherit;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    margin-top: 8px;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
  }
  .login-btn:hover { background: var(--accent-d); }
  .login-btn:active { transform: translateY(1px); }
  .login-btn:disabled {
    background: var(--text3);
    cursor: not-allowed;
    transform: none;
  }

  .error-msg {
    background: var(--danger-bg);
    border: 1px solid rgba(239, 68, 68, .25);
    color: var(--danger);
    padding: 10px 14px;
    font-size: .82rem;
    margin-bottom: 16px;
    border-radius: 8px;
    display: none;
  }

  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: .8rem;
    color: var(--text2);
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .footer a:hover { color: var(--accent-d); text-decoration: underline; }

  .version {
    text-align: center;
    color: var(--text3);
    font-size: .72rem;
    margin-top: 18px;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="brand-mark">RF</div>
    <div class="brand-text">
      <div class="brand-title">RightAPI Forge</div>
      <div class="brand-sub">Operations Intelligence Platform</div>
    </div>
  </div>

  <div class="card">
    <h1 id="loginHeader">Sign in</h1>
    <p class="subtitle" id="loginSub">Welcome back. Enter your credentials to continue.</p>

    <div class="error-msg" id="error"></div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="you@example.com" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign in</button>

    <div class="footer">
      Don't have an account? <a href="/register.html">Create one</a>
      <div style="margin-top: 10px;"><a href="/tui">Open terminal mode →</a></div>
    </div>
  </div>

  <div class="version">RightAPI Forge · v1.0</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('error')) {
  const el = document.getElementById('error');
  el.textContent = params.get('error');
  el.style.display = 'block';
}

// Tenant-aware header. Calls the public endpoint that resolves the
// tenant from the request's Host header. When we're on a real tenant
// subdomain, the banner becomes "Sign in to <Tenant Name>".
fetch('/api/tenant/public')
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data || !data.tenant || data.tenant.isSystem) return;
    const t = data.tenant;
    const headerEl = document.getElementById('loginHeader');
    const subEl = document.getElementById('loginSub');
    if (headerEl) headerEl.textContent = 'Sign in to ' + t.name;
    if (subEl) subEl.textContent = 'Tenant: ' + t.slug;
    document.title = 'Sign in · ' + t.name;
  })
  .catch(() => { /* network error — keep the default header */ });

// If already authenticated, redirect to the React app (or specified return path)
const existingToken = sessionStorage.getItem('itops_token') || localStorage.getItem('itops_token');
if (existingToken) {
  fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + existingToken } })
    .then(r => {
      if (r.ok) {
        const returnTo = params.get('return') || '/app/';
        window.location.href = returnTo;
      }
    })
    .catch(() => {});
}

const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorEl = document.getElementById('error');

passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordInput.focus(); });

async function doLogin() {
  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  if (!username || !password) {
    errorEl.textContent = 'Username and password required';
    errorEl.style.display = 'block';
    return;
  }
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in…';
  errorEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    const token = data.token || (data.session && data.session.token);
    if (res.ok && token) {
      sessionStorage.setItem('itops_token', token);
      localStorage.setItem('itops_token', token);
      const returnTo = params.get('return') || '/app/';
      window.location.href = returnTo;
    } else {
      errorEl.textContent = data.error || data.message || 'Invalid username or password';
      errorEl.style.display = 'block';
    }
  } catch (e) {
    errorEl.textContent = 'Connection error: ' + e.message;
    errorEl.style.display = 'block';
  }
  loginBtn.disabled = false;
  loginBtn.textContent = 'Sign in';
}
</script>
</body>
</html>
