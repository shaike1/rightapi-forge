<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IT Ops — Webhooks</title>
<script src="/auth-guard.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--t-bg:#0a0a0a;--t-fg:#33ff99;--t-dim:#1a6644;--t-cyan:#44aaaa;--t-yellow:#ccaa33;--t-red:#cc3333;--t-blue:#4488cc;--t-white:#e8e8d8;--t-border:#1a3322;--t-highlight:#112818;--bar-bg:#001a0d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'JetBrains Mono',monospace;background:var(--t-bg);color:var(--t-fg);font-size:13px;line-height:1.5;min-height:100vh}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px)}
nav{background:var(--bar-bg);border-bottom:1px solid var(--t-border);padding:6px 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
nav a{color:var(--t-dim);text-decoration:none;font-size:11px;padding:2px 6px}
nav a:hover{color:var(--t-fg)}
nav a.active{color:var(--t-bg);background:var(--t-fg);font-weight:700}
nav .sep{color:var(--t-dim);margin:0 4px}
.container{max-width:1400px;margin:0 auto;padding:16px}
.summary{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--t-highlight);border:1px solid var(--t-border);padding:8px 14px}
.stat .val{font-size:20px;font-weight:700}
.stat .lbl{font-size:10px;color:var(--t-dim)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button,.btn{font-family:inherit;font-size:11px;background:var(--t-highlight);color:var(--t-fg);border:1px solid var(--t-border);padding:4px 10px;cursor:pointer}
button:hover,.btn:hover{background:var(--t-fg);color:var(--t-bg)}
.btn-red{color:var(--t-red);border-color:var(--t-red)}
.btn-red:hover{background:var(--t-red);color:var(--t-bg)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--t-border)}
th{color:var(--t-dim);font-size:10px;text-transform:uppercase}
tr.row:hover{background:var(--t-highlight);cursor:pointer}
.badge{padding:2px 6px;font-size:10px;border-radius:2px}
.badge-notification{background:#1a3322;color:var(--t-fg)}
.badge-incident{background:#331a1a;color:var(--t-red)}
.badge-automation{background:#1a2a33;color:var(--t-blue)}
.badge-agent{background:#2a2a1a;color:var(--t-yellow)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-on{background:var(--t-fg)}.dot-off{background:var(--t-red)}
.mono{font-size:11px;color:var(--t-cyan)}
.detail{background:var(--t-highlight);border:1px solid var(--t-border);padding:12px;margin:4px 0}
.detail label{display:block;color:var(--t-dim);font-size:10px;margin-top:8px}
.detail .dval{color:var(--t-white)}
.form{background:var(--t-highlight);border:1px solid var(--t-border);padding:12px;margin-bottom:16px;display:none}
.form.open{display:block}
.form input,.form select,.form textarea{font-family:inherit;font-size:12px;background:var(--t-bg);color:var(--t-fg);border:1px solid var(--t-border);padding:4px 8px;width:100%;margin-top:2px}
.form textarea{height:50px;resize:vertical}
.form .frow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.form .frow>*{flex:1;min-width:180px}
.hidden{display:none}
  .titlebar{background:#224488;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;font-size:13px;}
  .titlebar-left{color:#e8e8d8;font-weight:bold;letter-spacing:0.1em;}
  .titlebar-right{color:#44aaaa;font-size:11px;}
  .statusbar{background:var(--bar-bg);border-top:1px solid var(--t-border);padding:3px 16px;font-size:11px;color:var(--t-dim);display:flex;justify-content:space-between;flex-shrink:0;}
</style>
</head>
<body>
<nav>
<a href="/tui">TERMINAL</a><a href="/tui-incidents">INCIDENTS</a><a href="/tui-servers">SERVERS</a><a href="/tui-chat">CHAT</a><a href="/tui-bridge">BRIDGE</a><a href="/tui-workflows">WORKFLOWS</a><a href="/tui-monitoring">MONITORING</a><a href="/tui-audit">AUDIT</a><a href="/tui-agents">AGENTS</a><a href="/tui-webhooks" class="active">WEBHOOKS</a><a href="/tui-irc">IRC</a><span class="sep">|</span><a href="/dashboard">GUI</a><a href="/login.html">LOGIN</a>
</nav>
<div class="container">
<div class="summary" id="summary"></div>
<div class="toolbar">
<button onclick="toggleForm()">+ NEW WEBHOOK</button>
<button onclick="loadWebhooks()">REFRESH</button>
</div>
<div class="form" id="createForm">
<h3 style="margin-bottom:8px;font-size:12px;color:var(--t-cyan)">&gt; CREATE WEBHOOK</h3>
<div class="frow"><div><label>Name</label><input id="f-name"></div><div><label>Action</label><select id="f-action" onchange="updateConfigFields()"><option value="notification">notification</option><option value="incident">incident</option><option value="automation">automation</option><option value="agent">agent</option></select></div></div>
<div style="margin-top:8px"><label>Description</label><input id="f-desc"></div>
<div id="configFields"></div>
<div style="margin-top:10px"><button onclick="createWebhook()">SAVE</button> <button onclick="toggleForm()">CANCEL</button></div>
</div>
<table><thead><tr><th>Name</th><th>Action</th><th>URL</th><th>Enabled</th><th>Triggers</th><th>Last Triggered</th></tr></thead><tbody id="tbl"></tbody></table>
</div>
<script>
const TOKEN = sessionStorage.getItem("itops_token") || localStorage.getItem("itops_token");
const BASE = window.location.origin;
const H = {"Content-Type": "application/json", "Authorization": "Bearer " + TOKEN};
let webhooks = [], expanded = null;

function api(method, path, body) {
  const opts = {method: method, headers: H};
  if (body) opts.body = JSON.stringify(body);
  return fetch(path, opts).then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}

function loadWebhooks() {
  api("GET", "/api/webhooks").then(function(d) {
    webhooks = d.webhooks || [];
    renderSummary(d);
    renderTable();
  }).catch(function(e) { console.error(e); });
}

function renderSummary(d) {
  var enabled = webhooks.filter(function(w) { return w.enabled; }).length;
  var today = new Date().toISOString().slice(0, 10);
  var triggered = webhooks.filter(function(w) { return w.lastTriggered && w.lastTriggered.startsWith(today); }).length;
  document.getElementById("summary").innerHTML =
    '<div class="stat"><div class="val">' + (d.total || webhooks.length) + '</div><div class="lbl">TOTAL</div></div>' +
    '<div class="stat"><div class="val">' + enabled + '</div><div class="lbl">ENABLED</div></div>' +
    '<div class="stat"><div class="val">' + (webhooks.length - enabled) + '</div><div class="lbl">DISABLED</div></div>' +
    '<div class="stat"><div class="val">' + triggered + '</div><div class="lbl">TRIGGERED TODAY</div></div>';
}

function renderTable() {
  var tb = document.getElementById("tbl");
  var html = "";
  for (var i = 0; i < webhooks.length; i++) {
    var w = webhooks[i];
    html += '<tr class="row" onclick="toggleDetail(' + i + ')"><td>' + esc(w.name) + '</td><td><span class="badge badge-' + w.action + '">' + w.action + '</span></td><td class="mono">' + esc(w.url) + '</td><td><span class="dot ' + (w.enabled ? "dot-on" : "dot-off") + '"></span></td><td>' + (w.triggerCount || 0) + '</td><td>' + (w.lastTriggered ? timeAgo(w.lastTriggered) : "never") + '</td></tr>';
    if (expanded === i) html += '<tr><td colspan="6">' + renderDetail(w) + '</td></tr>';
  }
  tb.innerHTML = html;
}

function renderDetail(w) {
  var url = BASE + w.url;
  var secret = w.secret || "***";
  var cfg = "";
  if (w.actionConfig) {
    var keys = Object.keys(w.actionConfig);
    for (var k = 0; k < keys.length; k++) {
      cfg += '<label>' + keys[k] + '</label><div class="dval">' + esc(String(w.actionConfig[keys[k]])) + '</div>';
    }
  }
  return '<div class="detail">' +
    '<label>Full URL</label><div class="dval mono">' + esc(url) + '</div>' +
    '<label>Secret (preview)</label><div class="dval mono">' + esc(secret) + '</div>' +
    cfg +
    '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">' +
    '<button onclick="copyUrl(\'' + escAttr(url) + '\')">COPY URL</button>' +
    '<button onclick="testHook(\'' + w.id + '\',\'' + escAttr(w.secret || '') + '\')">TEST</button>' +
    '<button onclick="toggleEnabled(\'' + w.id + '\',' + (!w.enabled) + ')">' + (w.enabled ? "DISABLE" : "ENABLE") + '</button>' +
    '<button onclick="regenSecret(\'' + w.id + '\')">REGEN SECRET</button>' +
    '<button class="btn-red" onclick="deleteHook(\'' + w.id + '\')">DELETE</button>' +
    '</div></div>';
}

function toggleDetail(i) { expanded = (expanded === i) ? null : i; renderTable(); }

function toggleForm() { document.getElementById("createForm").classList.toggle("open"); updateConfigFields(); }

function updateConfigFields() {
  var action = document.getElementById("f-action").value;
  var el = document.getElementById("configFields");
  if (action === "notification" || action === "incident") {
    el.innerHTML = '<div class="frow"><div><label>Severity</label><select id="f-sev"><option>info</option><option>warning</option><option>error</option></select></div></div><div style="margin-top:8px"><label>Title Template</label><input id="f-title" placeholder="{{event}} occurred"></div><div style="margin-top:8px"><label>Message Template</label><textarea id="f-msg" placeholder="Details: {{payload}}"></textarea></div>';
  } else if (action === "agent") {
    el.innerHTML = '<div style="margin-top:8px"><label>Agent ID</label><input id="f-agent" placeholder="agent-uuid"></div>';
  } else {
    el.innerHTML = "";
  }
}

function getConfig() {
  var action = document.getElementById("f-action").value;
  if (action === "notification" || action === "incident") {
    return {severity: document.getElementById("f-sev").value, titleTemplate: document.getElementById("f-title").value, messageTemplate: document.getElementById("f-msg").value};
  } else if (action === "agent") {
    return {agentId: document.getElementById("f-agent").value};
  }
  return {};
}

function createWebhook() {
  var body = {name: document.getElementById("f-name").value, description: document.getElementById("f-desc").value, action: document.getElementById("f-action").value, actionConfig: getConfig()};
  api("POST", "/api/webhooks", body).then(function() { toggleForm(); loadWebhooks(); }).catch(function(e) { alert("Error: " + e.message); });
}

function copyUrl(url) { navigator.clipboard.writeText(url).then(function() { alert("Copied!"); }).catch(function() { prompt("Copy:", url); }); }

function testHook(id, secret) {
  fetch(BASE + "/api/hook/" + id, {method: "POST", headers: {"Content-Type": "application/json", "X-Webhook-Secret": secret}, body: JSON.stringify({test: true, timestamp: new Date().toISOString()})}).then(function(r) { alert(r.ok ? "Test sent (" + r.status + ")" : "Failed: " + r.status); }).catch(function(e) { alert("Error: " + e); });
}

function toggleEnabled(id, enabled) { api("PATCH", "/api/webhooks/" + id, {enabled: enabled}).then(function() { loadWebhooks(); }); }
function regenSecret(id) { if (!confirm("Regenerate secret? Old integrations will break.")) return; api("POST", "/api/webhooks/" + id + "/regenerate").then(function() { loadWebhooks(); }); }
function deleteHook(id) { if (!confirm("Delete this webhook permanently?")) return; api("DELETE", "/api/webhooks/" + id).then(function() { expanded = null; loadWebhooks(); }); }

function timeAgo(ts) { var s = Math.floor((Date.now() - new Date(ts)) / 1000); if (s < 60) return s + "s ago"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function escAttr(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

loadWebhooks();
setInterval(loadWebhooks, 30000);
updateConfigFields();

setInterval(function(){document.getElementById("clock").textContent=new Date().toTimeString().slice(0,8);},1000);document.getElementById("clock").textContent=new Date().toTimeString().slice(0,8);
</script>
</body>
</html>
